name: AI Crypto DingTalk Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install requests
      - name: High Leverage Intraday Hunter
        run: |
          cat << 'PYEOF' > hunter.py
          import os, requests, json

          def rsi(prices, period=7):
              if len(prices) < period + 1: return 50
              gains, losses = [], []
              for i in range(1, len(prices)):
                  diff = prices[i] - prices[i-1]
                  gains.append(max(diff, 0))
                  losses.append(max(-diff, 0))
              avg_gain = sum(gains[-period:]) / period
              avg_loss = sum(losses[-period:]) / period
              if avg_loss == 0: return 100
              return 100 - (100 / (1 + avg_gain / avg_loss))

          def ema_series(prices, period):
              k = 2 / (period + 1)
              result = [prices[0]]
              for p in prices[1:]:
                  result.append(p * k + result[-1] * (1 - k))
              return result

          def macd(prices):
              e12 = ema_series(prices, 12)
              e26 = ema_series(prices, 26)
              macd_line = [e12[i] - e26[i] for i in range(len(e12))]
              signal_line = ema_series(macd_line, 9)
              return macd_line, signal_line

          def bollinger(prices, period=20):
              if len(prices) < period: return None, None, None
              recent = prices[-period:]
              ma = sum(recent) / period
              variance = sum((p - ma) ** 2 for p in recent) / period
              std = variance ** 0.5
              return ma + 2 * std, ma, ma - 2 * std

          def atr(prices, period=14):
              if len(prices) < period + 1: return 0
              trs = []
              for i in range(1, len(prices)):
                  trs.append(abs(prices[i] - prices[i-1]))
              return sum(trs[-period:]) / period

          def analyze(prices, volumes):
              if len(prices) < 30: return 0, 0, {}
              r = rsi(prices)
              r_prev = rsi(prices[:-1])
              price = prices[-1]
              e5_series = ema_series(prices, 5)
              e13_series = ema_series(prices, 13)
              e5, e13 = e5_series[-1], e13_series[-1]
              e5_prev, e13_prev = e5_series[-2], e13_series[-2]
              macd_line, signal_line = macd(prices)
              macd_now, sig_now = macd_line[-1], signal_line[-1]
              macd_prev, sig_prev = macd_line[-2], signal_line[-2]
              bb_upper, bb_mid, bb_lower = bollinger(prices)
              atr_val = atr(prices)
              atr_pct = (atr_val / price) * 100 if price > 0 else 1
              vol_avg = sum(volumes[-24:-1]) / max(len(volumes[-24:-1]), 1)
              vol_ratio = volumes[-1] / vol_avg if vol_avg > 0 else 1
              change_1h = ((price - prices[-2]) / prices[-2]) * 100
              bull, bear = 0, 0
              bull_msg, bear_msg = [], []
              
              if r_prev < 30 and r > r_prev:
                  bull += 30; bull_msg.append(f"RSI极超卖回升({r_prev:.0f}->{r:.0f})")
              if r_prev > 70 and r < r_prev:
                  bear += 30; bear_msg.append(f"RSI极超买回落({r_prev:.0f}->{r:.0f})")
              if e5_prev <= e13_prev and e5 > e13:
                  bull += 25; bull_msg.append("EMA5上穿EMA13(金叉)")
              if e5_prev >= e13_prev and e5 < e13:
                  bear += 25; bear_msg.append("EMA5下穿EMA13(死叉)")
              if vol_ratio > 1.5 and change_1h > 0.8:
                  bull += 25; bull_msg.append(f"日内爆量急涨(量比{vol_ratio:.1f})")
              if vol_ratio > 1.5 and change_1h < -0.8:
                  bear += 25; bear_msg.append(f"日内爆量急跌(量比{vol_ratio:.1f})")
              if macd_prev <= sig_prev and macd_now > sig_now:
                  bull += 10; bull_msg.append("MACD金叉")
              if macd_prev >= sig_prev and macd_now < sig_now:
                  bear += 10; bear_msg.append("MACD死叉")
              if bb_lower and price < bb_lower:
                  bull += 10; bull_msg.append("触及布林下轨")
              if bb_upper and price > bb_upper:
                  bear += 10; bear_msg.append("触及布林上轨")
              return bull, bear, {"rsi": round(r,2), "price": round(price,4), "vol_ratio": round(vol_ratio,2), "change_1h": round(change_1h,2), "atr_pct": round(atr_pct,2), "bull_msg": bull_msg, "bear_msg": bear_msg}

          coins = ['bitcoin', 'ethereum', 'solana', 'binancecoin', 'zcash', 'dogecoin']
          alerts = []
          for coin in coins:
              try:
                  url = f"https://api.coingecko.com/api/v3/coins/{coin}/market_chart?vs_currency=usd&days=1"
                  data = requests.get(url).json()
                  prices = [p[1] for p in data['prices']]
                  volumes = [v[1] for v in data['total_volumes']]
                  bull_1h, bear_1h, info_1h = analyze(prices, volumes)
                  if bull_1h >= 60:
                      alerts.append({"coin": coin, "direction": "看多", "score": bull_1h, "price": info_1h["price"], "atr_pct": info_1h["atr_pct"], "signals": info_1h["bull_msg"]})
                  elif bear_1h >= 60:
                      alerts.append({"coin": coin, "direction": "看空", "score": bear_1h, "price": info_1h["price"], "atr_pct": info_1h["atr_pct"], "signals": info_1h["bear_msg"]})
              except Exception as e:
                  print(f"{coin} error: {e}")

          if alerts:
              ds_key = os.environ.get('DEEPSEEK_API_KEY')
              prompt = f"你是一名专业的高杠杆日内交易员。以下是短线（15分钟-1小时级别）的指标数据：{json.dumps(alerts, ensure_ascii=False)}。请针对每个币种，用 Markdown 输出：1.交易方向（做多/做空/观望）2.建议杠杆（5x-20x，波动越大杠杆越低）3.开仓价 4.止损价（必须紧凑）5.止盈价（TP1和TP2）6.核心逻辑。警告：如果行情不够剧烈，直接建议观望。"
              ds_resp = requests.post('https://api.deepseek.com/v1/chat/completions', headers={'Authorization': f'Bearer {ds_key}', 'Content-Type': 'application/json'}, json={'model': 'deepseek-chat', 'messages': [{'role': 'user', 'content': prompt}]})
              analysis = ds_resp.json()['choices'][0]['message']['content']
              webhook = os.environ.get('DINGTALK_WEBHOOK')
              msg = {'msgtype': 'markdown', 'markdown': {'title': '⚡高杠杆日内信号', 'text': '## ⚡ 高杠杆日内信号\n\n' + analysis}}
              requests.post(webhook, json=msg)
          else:
              print("无高置信度短线信号，静默")
          PYEOF
          python3 hunter.py
        env:
          TICKDB_API_KEY: ${{ secrets.TICKDB_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}

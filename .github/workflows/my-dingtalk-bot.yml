name: AI Crypto DingTalk Bot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze and Push
        run: |
          python -c "
import os, requests, json

market_url = 'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true'
market_resp = requests.get(market_url).json()

ds_key = os.environ['DEEPSEEK_API_KEY']
ds_url = 'https://api.deepseek.com/v1/chat/completions'
prompt = f'以下是加密货币实时数据：{json.dumps(market_resp)}。请根据数据，分析当前市场是做多还是做空，并给出理由。'
ds_headers = {'Authorization': f'Bearer {ds_key}', 'Content-Type': 'application/json'}
ds_data = {'model': 'deepseek-chat', 'messages': [{'role': 'user', 'content': prompt}]}
ds_resp = requests.post(ds_url, headers=ds_headers, json=ds_data)
analysis = ds_resp.json()['choices'][0]['message']['content']

webhook = os.environ['DINGTALK_WEBHOOK']
msg = {'msgtype': 'markdown', 'markdown': {'title': '币圈AI分析', 'text': f'## 币圈AI分析\n\n{analysis}'}}
requests.post(webhook, json=msg)
          "
        env:
          TICKDB_API_KEY: ${{ secrets.TICKDB_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
